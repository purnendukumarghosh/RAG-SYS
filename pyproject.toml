[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbusvpn"
version = "1.0.0"
description = "Cloud-based secure VPN: WireGuard data plane with a hardened, self-hosted control plane and web dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "cryptography>=42",
    "pyotp>=2.9",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
nimbusvpn = "nimbusvpn.cli:main"

[tool.setuptools.packages.find]
include = ["nimbusvpn*"]

[tool.setuptools.package-data]
nimbusvpn = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
    "B008",  # FastAPI's Depends() in argument defaults is idiomatic
    "S603",  # subprocess calls use fixed argv lists, never a shell
    "S607",  # `wg` / `wg-quick` / `ip` are resolved from PATH on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
